svg { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
.bg { fill: #0A0E17; stroke: rgba(255,255,255,.09); stroke-width: 1px; }
.wrap { color: #E6EDF7; height: 100%; box-sizing: border-box; }
.head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.title { font-size: 15px; font-weight: 700; letter-spacing: -.2px; }
.title b { color: #4FC3F7; }
.pill { font-size: 10px; font-weight: 600; letter-spacing: 1.2px; color: #8FA0BE; padding: 3px 9px; border: 1px solid rgba(255,255,255,.12); border-radius: 999px; background: rgba(255,255,255,.04); }
.in { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.progress { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: rgba(255,255,255,.08); margin-bottom: 14px; gap: 2px; }
.progress-item { height: 100%; transform-origin: left; animation: grow 1s cubic-bezier(.2,.7,.2,1) forwards; transform: scaleX(0); }
@keyframes grow { to { transform: scaleX(1); } }
ul { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: 1fr 1fr; column-gap: 16px; row-gap: 6px; }
li { display: flex; align-items: center; font-size: 12px; opacity: 0; animation: rise .6s cubic-bezier(.2,.7,.2,1) forwards; white-space: nowrap; }
li:nth-child(n+9) { display: none; }
.octicon { margin-right: 6px; flex: none; }
.lang { font-weight: 600; color: #E6EDF7; margin-right: auto; overflow: hidden; text-overflow: ellipsis; }
.percent { color: #8FA0BE; font-variant-numeric: tabular-nums; margin-left: 8px; }
</style>
