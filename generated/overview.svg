.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.07); border-radius: 12px; padding: 9px 12px; }
.num { font-size: 22px; font-weight: 800; letter-spacing: -.5px; color: #fff; line-height: 1.1; }
.lbl { font-size: 11px; color: #8FA0BE; margin-top: 2px; display: flex; align-items: center; gap: 5px; }
.lbl svg { fill: #4FC3F7; }
</style>
